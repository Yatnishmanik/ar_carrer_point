name: Check application
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ar_test
          POSTGRES_PASSWORD: ci-test-database-only
          POSTGRES_DB: ar_career_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ar_test -d ar_career_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ar_test:ci-test-database-only@localhost:5432/ar_career_test?schema=public
      JWT_SECRET: ci-only-test-signing-key-never-use-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:push
      - run: npm run build
      - run: npm test
